name: Build Executable

on:
  push:
    tags:
      - 'v*'  # 当你推送 v1.0.0、v1.2 这样的标签时自动触发
  workflow_dispatch:  # 也可以手动在网页上点按钮触发

permissions:
  contents: write  # 允许上传文件到 Releases

jobs:
  build:
    runs-on: windows-latest  # 直接用 Windows 环境打包

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: 打包成 exe
        run: |
          pyinstaller --onefile --windowed --name "Hue-RGB-Sync" gui_control.py

      - name: 上传到 Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Hue-RGB-Sync.exe
