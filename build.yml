name: Build EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --add-data "mk850_key_mapping.ini;." --name "RGBSyncControl" gui_control.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RGB-Sync-Control-EXE
        path: dist/RGBSyncControl.exe